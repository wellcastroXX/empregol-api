name: empregol

services:
  db:
    image: postgres:16-alpine
    container_name: empregol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-empregol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-empregol}
    volumes:
      # Dados do banco ficam dentro do repo (que está no SSD Kingston)
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-empregol} -d ${POSTGRES_DB:-empregol}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - empregol-net

  api:
    build: .
    container_name: empregol-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-empregol}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-empregol}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Login social (Firebase Admin) — JSON do service account inline no .env do servidor
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # Uploads (mídia da vitrine + avatar) — prefixo público dos links e limite por arquivo
      PUBLIC_URL: ${PUBLIC_URL:-https://api.empregolstartup.com.br}
      # URL do site usada nos links de e-mail (redefinicao de senha).
      FRONTEND_URL: ${FRONTEND_URL:-https://empregolstartup.com.br}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # Notificações: chave dos endpoints admin, modo teste e liga/desliga do cron
      ADMIN_KEY: ${ADMIN_KEY:-}
      NOTIF_TEST_MODE: ${NOTIF_TEST_MODE:-false}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      PORT: 3000
      NODE_ENV: production
    ports:
      # Mantido para acesso direto na LAN (http://192.168.3.197:3000), além do domínio público.
      - "${API_PORT:-3000}:3000"
    volumes:
      # Mídias/avatars persistem no SSD junto ao repo (mesmo padrão do pgdata)
      - ./uploads:/app/uploads
    networks:
      - empregol-net
      - proxy
    labels:
      # Publicação via Traefik + Cloudflare Tunnel (TLS no edge da Cloudflare, HTTP no entrypoint web)
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.empregol-api.entrypoints=web"
      - "traefik.http.routers.empregol-api.rule=Host(`${API_DOMAIN:-api.empregolstartup.com.br}`) || Host(`api.empregol.co`)"
      - "traefik.http.services.empregol-api.loadbalancer.server.port=3000"

  # Backup semanal do Postgres (pg_dump gzip). Guarda em ./backups e apaga
  # dumps com mais de 60 dias (~8 semanas). Primeiro dump roda ao subir.
  backup:
    image: postgres:16-alpine
    container_name: empregol-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        echo "🗄  Backup semanal do empregol iniciado";
        while true; do
          FILE="/backups/empregol-$$(date +%Y%m%d-%H%M%S).sql.gz";
          echo "⏳ Gerando $$FILE";
          if pg_dump -h db -U ${POSTGRES_USER:-empregol} ${POSTGRES_DB:-empregol} | gzip > "$$FILE"; then
            echo "✅ Backup OK: $$FILE";
          else
            echo "❌ Backup falhou"; rm -f "$$FILE";
          fi;
          find /backups -name "*.sql.gz" -mtime +60 -delete;
          sleep 604800;
        done
    networks:
      - empregol-net

networks:
  empregol-net:
    driver: bridge
  proxy:
    external: true
